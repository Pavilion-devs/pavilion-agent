<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavilion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f4f8; --panel: #ffffff; --ink: #15151f; --muted: #6e6f80; --line: #e7e6ef; --soft: #f7f6fb;
  --accent: #6d4aff; --accent-2: #9b7bff; --accent-soft: #efeaff; --ok: #10a36f; --ok-soft: #e4f6ee; --bad: #e5484d; --bad-soft: #fdecec;
  --warn: #b7791f; --warn-soft: #fdf3e1; --code: #f5f4fa; --side: #ffffff; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --shadow: 0 1px 2px rgba(21,21,31,.04), 0 8px 24px rgba(21,21,31,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0e14; --panel: #17171f; --ink: #f0f0f5; --muted: #9a9bb0; --line: #26263a; --soft: #1c1c27;
  --accent: #8f74ff; --accent-2: #b39dff; --accent-soft: #241e45; --ok: #3dd68c; --ok-soft: #12291f; --bad: #ff6b6f; --bad-soft: #351719;
  --warn: #f0b952; --warn-soft: #2e2412; --code: #1f1f2b; --side: #13131a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); } }
:root[data-theme="dark"] {
  --bg: #0e0e14; --panel: #17171f; --ink: #f0f0f5; --muted: #9a9bb0; --line: #26263a; --soft: #1c1c27;
  --accent: #8f74ff; --accent-2: #b39dff; --accent-soft: #241e45; --ok: #3dd68c; --ok-soft: #12291f; --bad: #ff6b6f; --bad-soft: #351719;
  --warn: #f0b952; --warn-soft: #2e2412; --code: #1f1f2b; --side: #13131a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 Inter, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
aside.side { background: var(--side); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; }
.logo .mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #c06bff); display: grid; place-items: center; color: #fff; font-size: 16px; }
.nav-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 8px 6px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--muted); background: none; border: 0; padding: 8px 10px; border-radius: 9px; cursor: pointer; }
.nav button:hover { background: var(--soft); color: var(--ink); }
.nav button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; }
.run-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; background: var(--panel); }
.run-card.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.run-card b { display: block; font-size: 13.5px; } .run-card span { font-size: 12px; color: var(--muted); }
.side-foot { margin-top: auto; font-size: 12px; color: var(--muted); line-height: 1.6; }
.side-foot b { color: var(--ink); font-weight: 600; }
main { padding: 22px 28px 40px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.crumbs { font-size: 13px; color: var(--muted); }
.badge { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 3px 10px; border-radius: 99px; }
.controls { display: flex; gap: 8px; align-items: center; }
.btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 10px; cursor: pointer; }
.btn.primary { background: linear-gradient(135deg, var(--accent), #8a5cff); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(109,74,255,.3); min-width: 108px; }
select { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 7px 8px; }
.ask { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center; }
.ask .q { font-size: 19px; font-weight: 650; letter-spacing: -.01em; flex: 1; }
.ask .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; flex: none; }
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 12px; }
.progress div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #c06bff); transition: width .3s; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .n { font-size: 26px; font-weight: 750; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.hero { background: linear-gradient(135deg, var(--accent), #9a55ff); color: #fff; border-color: transparent; }
.kpi.hero .l, .kpi.hero .s { color: rgba(255,255,255,.8); }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: 14px; margin: 0; font-weight: 650; }
.card-h .sub { font-size: 12px; color: var(--muted); }
.chart { padding: 10px 18px 16px; }
#timeline { list-style: none; margin: 0; padding: 6px 0; max-height: 560px; overflow-y: auto; }
#timeline li { padding: 9px 18px; border-left: 3px solid transparent; animation: in .35s ease; }
#timeline li.call { padding: 1px 18px 1px 34px; color: var(--muted); font-size: 12px; font-family: var(--mono); }
#timeline li.key { border-left-color: var(--accent); } #timeline li.good { border-left-color: var(--ok); } #timeline li.badl { border-left-color: var(--bad); }
@keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.who { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-right: 6px; }
.t { float: right; color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
.chip { font-family: var(--mono); font-size: 11.5px; background: var(--accent-soft); color: var(--accent); border: 0; padding: 1px 7px; border-radius: 6px; cursor: pointer; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 99px; margin: 2px 4px 2px 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.tabs { display: flex; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { font: inherit; font-weight: 500; border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.tabs button.on { background: var(--accent-soft); color: var(--accent); font-weight: 650; }
.pane { padding: 16px 18px; max-height: 560px; overflow-y: auto; }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--panel); }
.item.ok { border-left: 4px solid var(--ok); } .item.bad { border-left: 4px solid var(--bad); }
.reason { color: var(--bad); font-size: 13px; margin-top: 6px; } .fix { font-size: 13px; margin-top: 6px; color: var(--muted); } .fix b { color: var(--ink); }
.memo h3 { font-size: 15px; margin: 16px 0 6px; } .memo p { margin: 6px 0; }
.memo table, .rows { border-collapse: collapse; font-size: 13px; margin: 8px 0; }
.memo td, .memo th, .rows td, .rows th { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
.rows { font-family: var(--mono); font-size: 12px; }
pre { background: var(--code); padding: 12px 14px; border-radius: 10px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; font-family: var(--mono); }
.muted { color: var(--muted); } .small { font-size: 13px; }
h3.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
.bar { height: 6px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), #c06bff); display: inline-block; vertical-align: middle; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
.mini div { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; } .mini b { font-size: 20px; display: block; }
#drawer { position: fixed; right: 0; top: 0; bottom: 0; width: min(660px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -20px 0 40px rgba(0,0,0,.15); transform: translateX(105%); transition: transform .25s; z-index: 10; overflow-y: auto; padding: 22px; }
#drawer.open { transform: none; }
.empty { color: var(--muted); padding: 24px 4px; text-align: center; }
@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside.side { position: static; height: auto; } .grid2 { grid-template-columns: 1fr; } main { padding: 16px; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><div class="mark">P</div>Pavilion</div>
    <div>
      <div class="nav-label">Investigations</div>
      <div id="runs" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="nav">
      <div class="nav-label">Views</div>
      <div id="tabs-side"></div>
    </div>
    <div class="side-foot">
      <b>Data</b> Zetaris semantic layer<br>
      <b>Models</b> NVIDIA Nemotron via Meterless Nightshift<br>
      <b>Engines</b> World Model · H-MEM
    </div>
  </aside>
  <main>
    <div class="top">
      <div><div class="crumbs">Investigations / <span id="crumb"></span></div></div>
      <div class="controls">
        <span class="badge">Replay of a recorded run · real logs</span>
        <select id="speed" aria-label="Speed"><option value="900" selected>1×</option><option value="450">2×</option><option value="180">5×</option></select>
        <button class="btn" id="skip">Show all</button>
        <button class="btn primary" id="play">▶ Play</button>
      </div>
    </div>
    <div class="ask"><div class="avatar">A</div><div class="q" id="question"></div></div>
    <div class="progress"><div id="prog"></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <section class="card">
        <div class="card-h"><h2>Agent timeline</h2><span class="sub" id="tl-sub">live</span></div>
        <ol id="timeline"></ol>
      </section>
      <section class="card">
        <div class="tabs" id="tabs"></div>
        <div class="pane" id="pane"></div>
      </section>
    </div>
    <section class="card" style="margin-top:16px">
      <div class="card-h"><h2>Gross margin change vs peers</h2><span class="sub" id="chart-sub"></span></div>
      <div class="chart" id="chart"></div>
    </section>
  </main>
</div>
<aside id="drawer"></aside>
<script src="replay_data.js"></script>
<script>
const D = window.PAVILION;
const LABELS = [["Target", "first run · empty memory"], ["Best Buy", "second run · memory recalled"]];
const TABS = ["Plan", "Critic", "Memo", "Memory", "Evidence", "Sponsor tech"];
let run = D.runs[0], idx = 0, timer = null, tab = "Plan", shown = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const short = m => (m || "").replace("nvidia/", "").replace("-550b-a55b", "").replace("-30b-a3b", "");
const fmtT = t => { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, "0")}`; };
const chips = text => esc(text).replace(/\bq_[0-9a-f]{10}\b/g, q => `<button class="chip" data-q="${q}">${q}</button>`);
const fmt = v => (v > 0 ? "+" : "") + v.toFixed(2);

function md(src) {
  const lines = src.split("\n"); let out = "", inList = false, table = [];
  const inline = s => chips(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  const flushTable = () => { if (!table.length) return; const rows = table.filter(r => !/^\|[\s:-]+\|/.test(r));
    out += "<table>" + rows.map((r, i) => "<tr>" + r.split("|").slice(1, -1).map(c => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("") + "</tr>").join("") + "</table>"; table = []; };
  for (const l of lines) {
    if (l.trim().startsWith("|")) { table.push(l.trim()); continue; } else flushTable();
    if (/^\s*[-*] /.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) out += `<h3>${inline(h[2])}</h3>`; else if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  flushTable(); if (inList) out += "</ul>"; return out;
}

function eventHtml(e) {
  const t = `<span class="t">${fmtT(e.t)}</span>`;
  switch (e.event) {
    case "start": return ["key", `${t}<span class="who">Analyst</span>${esc(e.question)}`];
    case "retrieve": { const m = e.memories || []; return [m.length ? "good" : "", `${t}<span class="who">H-MEM</span>${m.length ? `Recalled <b>${m.length}</b> lessons from earlier investigations` : "No lessons in memory yet: first investigation in this sector"}`]; }
    case "model_call": return ["call", `↳ ${esc(e.agent)} · ${esc(short(e.model))} · ${(e.latency_ms / 1000).toFixed(1)} s · ${esc(e.receipt || "")}${e.cached ? " · cached" : ""}`];
    case "fallback": return ["call fb",`↳ ${esc(e.agent)}: ${esc(short(e.frm))} hung → switched to ${esc(short(e.model))}`];
    case "plan": return ["key", `${t}<span class="who">Planner</span>${esc(e.plan.company)} ${esc(e.plan.metric)}, ${esc(e.plan.focus_period)} vs ${esc((e.plan.peers || []).join(", "))} · ${(e.plan.hypotheses || []).length} hypotheses`];
    case "query": return ["", `${t}<span class="who">Investigator · Zetaris</span>${esc(e.purpose)} → <button class="chip" data-q="${e.query_id}">${e.query_id}</button> <span class="muted small">${e.rows} rows</span>`];
    case "findings": return ["key", `${t}<span class="who">Investigator</span>Proposes ${(e.findings || []).length} findings`];
    case "recompute": { const p = Object.keys(e.automated_problems || {}); return ["", `${t}<span class="who">Critic · Zetaris</span>Re-ran <b>${e.requeried}</b> cited queries: ${e.reproduced} reproduced exactly. ${p.length ? `Numbers not in the results: ${p.join(", ")}` : "Every number traced to a result."}`]; }
    case "verdict": return [e.rejected.length ? "badl" : "good", `${t}<span class="who">Critic · round ${e.round}</span>${e.approved.map(i => `<span class="pill ok">${i} approved</span>`).join("")}${e.rejected.map(r => `<span class="pill bad">${r.id} rejected</span>`).join("")}`];
    case "memo": return ["good", `${t}<span class="who">Reporter</span>Memo written from approved findings only`];
    case "learn": return ["good", `${t}<span class="who">H-MEM</span>Learned <b>${(e.learned || []).length}</b> lessons from Critic rejections and approved findings`];
    case "done": return ["key", `${t}<span class="who">Done</span>${e.rounds} Critic rounds · ${fmtT(e.elapsed_s)} wall clock`];
  }
  return null;
}
const AUTO_TAB = {plan: "Plan", verdict: "Critic", memo: "Memo", learn: "Memory"};

function lastDecomp() { const f = run.events.filter(e => e.event === "findings"); return f.length ? f[f.length - 1].decomposition : null; }
function reached(ev) { return [...shown].some(s => s.startsWith(ev + ":")); }

function renderKpis() {
  const dcp = lastDecomp() || {}, s = run.stats, P = run.plan, done = reached("memo");
  const verdicts = run.events.filter(e => e.event === "verdict" && shown.has("verdict:" + e.round));
  const last = verdicts[verdicts.length - 1];
  const k = (l, n, sub, hero) => `<div class="kpi${hero ? " hero" : ""}"><div class="l">${l}</div><div class="n">${n}</div><div class="s">${sub}</div></div>`;
  $("#kpis").innerHTML =
    k(`${esc(P.ticker)} gross margin`, done ? fmt(dcp.company_change_pts) : "—", "points, same 10-K") +
    k("Peer median", done ? fmt(dcp.peer_median_change_pts) : "—", `${(P.peers || []).length} peers`) +
    k("Company-specific", done ? fmt(dcp.company_specific_pts) : "—", done ? (Math.abs(dcp.company_specific_pts) > Math.abs(dcp.peer_median_change_pts) ? "mostly the company" : "mostly the sector") : "after the Critic approves", true) +
    k("Critic verdict", last ? `${last.approved.length}/${last.approved.length + last.rejected.length}` : "—", last ? `approved in round ${last.round}` : "waiting for findings") +
    k("Zetaris queries", run.events.filter(e => e.event === "query" && shown.has("query:")).length ? `${[...document.querySelectorAll("#timeline li")].filter(li => li.textContent.includes("Investigator · Zetaris")).length}` : "0", `+ ${s.recomputes} Critic re-runs`) +
    k("Nemotron calls", `${document.querySelectorAll("#timeline li.call:not(.fb)").length}`, "each with a Nightshift receipt");
}

function renderChart() {
  const q = Object.values(run.queries).find(q => q.agent === "investigator" && q.columns.includes("ticker") && q.columns.some(c => c.includes("gross_margin_change")));
  if (!q) return $("#chart").innerHTML = "";
  const ci = q.columns.indexOf("ticker"), vi = q.columns.findIndex(c => c.includes("gross_margin_change"));
  const rows = q.rows.map(r => [r[ci], r[vi] * (Math.abs(r[vi]) < 1 ? 100 : 1)]).sort((a, b) => a[1] - b[1]);
  const max = Math.max(...rows.map(r => Math.abs(r[1]))), W = 1000, rowH = 34, mid = 600, scale = 420 / max;
  const med = lastDecomp() ? lastDecomp().peer_median_change_pts : null;
  const bars = rows.map(([t, v], i) => {
    const y = 10 + i * rowH, me = t === run.plan.ticker, w = Math.abs(v) * scale, x = v < 0 ? mid - w : mid;
    return `<text x="10" y="${y + 19}" font-size="13" font-weight="${me ? 700 : 500}" fill="var(--ink)">${t}${me ? " (asked)" : ""}</text>
      <rect x="${x}" y="${y + 4}" width="${Math.max(w, 2)}" height="22" rx="6" fill="${me ? "url(#g)" : "var(--line)"}"/>
      <text x="${v < 0 ? mid + 8 : x + w + 8}" y="${y + 19}" font-size="12.5" text-anchor="start" fill="var(--muted)" font-family="JetBrains Mono, monospace">${fmt(v)} pts</text>`;
  }).join("");
  const H = rows.length * rowH + 20;
  const medLine = med != null ? `<line x1="${mid + med * scale}" x2="${mid + med * scale}" y1="0" y2="${H}" stroke="var(--accent)" stroke-dasharray="4 4"/><text x="${mid + med * scale + 6}" y="${H - 4}" font-size="12" fill="var(--accent)">peer median ${fmt(med)}</text>` : "";
  $("#chart").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gross margin change by company">
    <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#c06bff"/></linearGradient></defs>
    <line x1="${mid}" x2="${mid}" y1="0" y2="${H}" stroke="var(--muted)" stroke-opacity=".4"/>${bars}${medLine}</svg>`;
  $("#chart-sub").innerHTML = `from <button class="chip" data-q="${q.id}">${q.id}</button> · edgar.margin_change, both years from one 10-K`;
}

function step() {
  const evs = run.events;
  while (idx < evs.length) {
    const e = evs[idx++]; const h = eventHtml(e); if (!h) continue;
    const li = document.createElement("li"); li.className = h[0]; li.innerHTML = h[1];
    const tl = $("#timeline"); tl.appendChild(li); tl.scrollTop = tl.scrollHeight;
    shown.add(e.event + ":" + (e.round || ""));
    if (AUTO_TAB[e.event] && timer) setTab(AUTO_TAB[e.event]); else renderPane();
    renderKpis();
    $("#prog").style.width = (100 * idx / evs.length) + "%";
    return;
  }
  stop();
}
function tick() { if (idx >= run.events.length) return stop(); step(); const e = run.events[idx - 1]; timer = setTimeout(tick, e && (e.event === "model_call" || e.event === "fallback") ? +$("#speed").value / 3 : +$("#speed").value); }
function play() { if (idx >= run.events.length) reset(); $("#play").textContent = "❚❚ Pause"; timer = setTimeout(tick, 100); }
function stop() { clearTimeout(timer); timer = null; $("#play").textContent = idx >= run.events.length ? "↺ Replay" : "▶ Play"; }
function reset() { stop(); idx = 0; shown = new Set(); $("#timeline").innerHTML = ""; $("#prog").style.width = 0; setTab("Plan"); renderKpis(); }
function skipAll() { stop(); while (idx < run.events.length) step(); stop(); renderPane(); renderKpis(); }

function setTab(t) { tab = t; document.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === t)); renderPane(); }

function renderPane() {
  const p = $("#pane"), P = run.plan;
  const wait = what => `<div class="empty">${what} appears when the replay reaches it. Press Play, or Show all.</div>`;
  if (tab === "Plan") {
    if (!reached("plan")) return p.innerHTML = wait("The plan");
    p.innerHTML = `<div class="mini"><div><b>${esc(P.ticker)}</b><span class="muted small">${esc(P.metric)} · ${esc(P.focus_period)}</span></div>
      <div><b>${(P.peers || []).length} peers</b><span class="muted small">${esc((P.peers || []).join(", "))}</span></div>
      <div><b>${(P.excluded_peers || []).length} excluded</b><span class="muted small">with a documented reason</span></div></div>
      ${(P.excluded_peers || []).map(x => `<div class="item"><b>${esc(x.ticker)} excluded:</b> ${esc(x.reason)}</div>`).join("")}
      <h3 class="sec">Hypotheses · sector-wide and company-specific</h3>
      ${(P.hypotheses || []).map(h => `<div class="item"><b>${esc(h.id)}</b> ${esc(h.driver)}<div class="muted small">${esc(h.how_to_test)}</div></div>`).join("")}`;
  } else if (tab === "Critic") {
    const rounds = run.rounds.filter(r => shown.has("verdict:" + r.round));
    if (!rounds.length) return p.innerHTML = wait("The Critic's verdicts");
    p.innerHTML = `<p class="small muted" style="margin-top:0">Approved only if every cited query re-runs in Zetaris with identical rows, every number traces to those rows, and a Nemotron Ultra review passes a methodology checklist. Rejections go back to the Investigator with the fix.</p>` +
      rounds.map(r => `<h3 class="sec">Round ${r.round} · ${r.critic.approved.length} approved, ${r.critic.rejected.length} rejected</h3>` +
        [...r.critic.rejected.map(f => [f, false]), ...r.critic.approved.map(f => [f, true])].map(([f, ok]) => `<div class="item ${ok ? "ok" : "bad"}">
          <span class="pill ${ok ? "ok" : "bad"}">${esc(f.id)} ${ok ? "approved" : "rejected"}</span> ${chips(f.statement)}
          <div class="small muted">evidence: ${(f.evidence || []).map(q => `<button class="chip" data-q="${q}">${q}</button>`).join(" ")}</div>
          ${ok ? "" : (f.critic.reasons || []).map(x => `<div class="reason">✗ ${esc(x)}</div>`).join("") + (f.critic.fix ? `<div class="fix"><b>Fix:</b> ${esc(f.critic.fix)}</div>` : "")}
        </div>`).join("")).reverse().join("");
  } else if (tab === "Memo") {
    if (!reached("memo")) return p.innerHTML = wait("The memo");
    p.innerHTML = `<p class="small muted" style="margin-top:0">Click any query id for the SQL Zetaris ran and the rows behind the number.</p><div class="memo">${md(run.memo)}</div>`;
  } else if (tab === "Memory") {
    const rec = run.memory.recalled, learned = run.memory.learned;
    let h = `<h3 class="sec" style="margin-top:0">Recalled before planning · hybrid score ≥ ${rec.trace.threshold}</h3>`;
    h += rec.memories.length ? rec.memories.map(m => `<div class="item ok"><span class="bar" style="width:${Math.round(m.score * 140)}px"></span> <b>${m.score}</b> <span class="muted small">· ${esc(m.layer)}</span><div>${esc(m.content)}</div></div>`).join("")
      : `<div class="item muted">Nothing yet: this is the first investigation in the sector.</div>`;
    h += `<h3 class="sec">Learned after this run</h3>` + (reached("learn") ? learned.map(m => `<div class="item"><span class="pill ${m.event === "user_correction" ? "bad" : "ok"}">${m.event === "user_correction" ? "from a Critic rejection" : "from an approved finding"}</span><div>${esc(m.content)}</div></div>`).join("") : wait("What it learned"));
    p.innerHTML = h;
  } else if (tab === "Evidence") {
    const qs = Object.values(run.queries).filter(q => q.agent === "investigator");
    p.innerHTML = `<p class="small muted" style="margin-top:0">Every query the Investigator ran on the Zetaris semantic layer. The Critic re-ran cited ones ${run.stats.recomputes} times.</p>` +
      qs.map(q => `<div class="item"><button class="chip" data-q="${q.id}">${q.id}</button> ${esc(q.purpose)} <span class="muted small">· ${q.row_count} rows · ${q.elapsed_ms} ms</span></div>`).join("");
  } else if (tab === "Sponsor tech") {
    const s = run.stats;
    p.innerHTML = `<div class="mini"><div><b>${s.queries}</b><span class="muted small">Zetaris queries</span></div><div><b>${s.recomputes}</b><span class="muted small">Critic re-executions</span></div>
      <div><b>${s.receipts}</b><span class="muted small">Nightshift receipts</span></div><div><b>${run.world.facts ?? "-"}</b><span class="muted small">World Model facts</span></div></div>
      <h3 class="sec">NVIDIA Nemotron via Meterless Nightshift</h3>
      ${Object.entries(s.by_model).map(([m, n]) => `<div class="item"><b>${esc(m)}</b> · ${n} calls<div class="muted small">${m.includes("lightning") ? "Planner (thinking off); fallback when Ultra hangs" : "Investigator, Critic, Reporter, H-MEM miner"}</div></div>`).join("")}
      <h3 class="sec">Zetaris data-quality rules · RUN DQ: 0 invalid records</h3>
      ${D.dq.map(r => `<div class="item"><b>${esc(r.name)}</b> <span class="muted small">on ${esc(r.table)}</span><div class="small">${esc(r.why)}</div><pre>${esc(r.rule)}</pre></div>`).join("")}
      <h3 class="sec">Meterless engines</h3>
      <div class="item"><b>World Model</b> · append-only event log, stable hash IDs, every Zetaris result ingested as facts with provenance. The Critic grounds every quoted number in these facts.</div>
      <div class="item"><b>H-MEM</b> · tiered memory, hybrid retrieval score, trust ledger and feedback. Critic rejections become lessons the next investigation recalls.</div>`;
  }
}

function openQuery(id) {
  const q = run.queries[id]; if (!q) return;
  $("#drawer").innerHTML = `<button class="btn" style="float:right" onclick="document.querySelector('#drawer').classList.remove('open')">Close</button>
    <h3 style="margin-top:4px">${esc(id)}</h3><p>${esc(q.purpose)}</p><p class="muted small">${esc(q.agent)} · ${q.row_count} rows · ${q.elapsed_ms} ms in Zetaris</p>
    <pre>${esc(q.sql)}</pre>${q.error ? `<p class="reason">${esc(q.error)}</p>` : ""}
    <div style="overflow-x:auto"><table class="rows"><tr>${q.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr>
    ${q.rows.map(r => `<tr>${r.map(v => `<td>${esc(typeof v === "number" && !Number.isInteger(v) ? +v.toFixed(6) : v)}</td>`).join("")}</tr>`).join("")}</table></div>
    ${q.row_count > q.rows.length ? `<p class="muted small">First ${q.rows.length} of ${q.row_count} rows.</p>` : ""}`;
  $("#drawer").classList.add("open");
}

function selectRun(i) {
  run = D.runs[i]; document.querySelectorAll(".run-card").forEach((b, j) => b.classList.toggle("on", j === i));
  $("#question").textContent = run.question; $("#crumb").textContent = run.plan.company + " · " + run.plan.focus_period;
  reset(); renderChart();
}

$("#runs").innerHTML = D.runs.map((r, i) => `<div class="run-card" data-i="${i}"><b>${(LABELS[i] || [r.id])[0]}</b><span>${(LABELS[i] || ["", ""])[1]}</span></div>`).join("");
$("#tabs").innerHTML = TABS.map(t => `<button data-t="${t}">${t}</button>`).join("");
$("#tabs-side").innerHTML = TABS.map(t => `<button data-t="${t}"><span class="dot"></span>${t}</button>`).join("");
$("#runs").onclick = e => { const c = e.target.closest(".run-card"); if (c) selectRun(+c.dataset.i); };
document.addEventListener("click", e => { const t = e.target.closest("[data-t]"); if (t) setTab(t.dataset.t); if (e.target.dataset && e.target.dataset.q) openQuery(e.target.dataset.q); });
$("#play").onclick = () => timer ? stop() : play();
$("#skip").onclick = skipAll;
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#drawer").classList.remove("open"); });
selectRun(0);
</script>
</body>
</html>
